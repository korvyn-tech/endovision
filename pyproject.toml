[project]
name = "endovision"
version = "0.1.0"
description = "Motor de visão computacional e aprimoramento de radiografias periapicais para endodontia"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=2.1.0",
    "pillow>=11.0.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.1.9",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/endovision"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
